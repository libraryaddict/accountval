name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build
      - if: github.event_name == 'push'
        run: |
          git config user.name "Build Script"
          git config user.email "<>"
          git fetch --all
          git switch release
          rm -r scripts/
          mv built/scripts scripts
          git add scripts/
          git commit -m "Build Mafia files for commit $GITHUB_SHA"
          git push origin release
      - if: github.event_name == 'push'
        env:
          REFRESH_SECRET: ${{ secrets.ACCOUNTVAL_REFRESH_SECRET }}
        run: |
          git switch browser || git switch --orphan browser
          cp built/browser/accountval.js accountval.js
          git add accountval.js
          git commit -m "Build browser script for commit $GITHUB_SHA"
          git push origin browser
          curl -fsS -X POST -H "Authorization: Bearer $REFRESH_SECRET" "https://accountval.lib.co.nz/refresh?sha=$(git rev-parse HEAD)"
